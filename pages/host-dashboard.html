<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />

</head>
<body data-page="profile">
  <nav class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-logo">
        <span class="logo-icon">⌂</span>
        <span class="logo-text">Copartment</span>
      </a>
      <ul class="navbar-menu">
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="profile.html" class="nav-link">Profile</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-section">
    <div class="container">
      <div class="profile-card panel" style="padding:24px;">
        <div class="page-header">
          <div>
            <h1>My profile</h1>
            <p class="muted">Account details and identity settings.</p>
          </div>
          <button class="btn btn-outline">Edit profile</button>
        </div>

        <div class="two-col">
          <div class="form-card" style="padding:20px;">
            <div class="user-row">
              <div class="avatar" style="width:60px; height:60px; font-size:1.3rem;">A</div>
              <div>
                <h3>Ada Okafor</h3>
                <div class="muted">Guest account</div>
              </div>
            </div>
          </div>
          <div class="form-card" style="padding:20px;">
            <div class="overview-list">
              <div class="overview-item"><span>Email</span><strong>ada@example.com</strong></div>
              <div class="overview-item"><span>Phone</span><strong>+234 803 000 1111</strong></div>
              <div class="overview-item"><span>Verification</span><strong>Pending</strong></div>
            </div>
          </div>
        </div>
      </div>
    </div>
