<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Copartment</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-logo"><span class="logo-icon">⌂</span><span class="logo-text">Copartment</span></a>
      <ul class="navbar-menu">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="contact.html" class="nav-link">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-section">
    <div class="container">
      <div class="panel" style="padding:24px; max-width:700px; margin:0 auto;">
        <h1>Contact us</h1>
        <form class="auth-form mt-3">
          <div class="form-group"><label>Name</label><input class="form-control" type="text" /></div>
          <div class="form-group"><label>Email</label><input class="form-control" type="email" /></div>
          <div class="form-group"><label>Message</label><textarea class="form-control"></textarea></div>
          <button type="button" class="btn btn-primary">Send message</button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
