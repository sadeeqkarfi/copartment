<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Property | Copartment</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body data-page="add-property">
  <nav class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-logo">
        <span class="logo-icon">⌂</span>
        <span class="logo-text">Copartment</span>
      </a>
      <ul class="navbar-menu">
        <li><a href="host-dashboard.html" class="nav-link">Host dashboard</a></li>
        <li><a href="add-property.html" class="nav-link">Add property</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-section">
    <div class="container">
      <div class="page-header">
        <div>
          <h1>List your space</h1>
          <p class="muted">Complete the form to publish a property for verification.</p>
        </div>
        <span class="ring" id="step-indicator">1 / 6</span>
      </div>

      <form id="property-form" class="form-card" style="padding:24px;">
        <div class="multi-step active">
          <h2>Step 1: Basic information</h2>
          <div class="form-grid two-col">
            <div class="form-group"><label for="title">Property title</label><input id="title" name="title" class="form-control" type="text" required /></div>
            <div class="form-group"><label for="propertyType">Property type</label><select id="propertyType" name="propertyType" class="form-select"><option>Apartment</option><option>Studio</option><option>Duplex</option><option>Shared Apartment</option></select></div>
            <div class="form-group"><label for="accommodationType">Accommodation type</label><select id="accommodationType" name="accommodationType" class="form-select"><option>Room</option><option>Apartment</option><option>Shared Room</option></select></div>
            <div class="form-group"><label for="description">Description</label><textarea id="description" name="description" placeholder="Describe the property"></textarea></div>
          </div>
          <div class="form-actions"><button type="button" class="btn btn-primary" data-next>Next</button></div>
        </div>

        <div class="multi-step">
          <h2>Step 2: Location</h2>
          <div class="form-grid two-col">
            <div class="form-group"><label for="state">State</label><input id="state" name="state" class="form-control" type="text" /></div>
            <div class="form-group"><label for="city">City</label><input id="city" name="city" class="form-control" type="text" /></div>
            <div class="form-group"><label for="area">Area</label><input id="area" name="area" class="form-control" type="text" /></div>
            <div class="form-group"><label for="address">Address</label><input id="address" name="address" class="form-control" type="text" /></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" data-prev>Previous</button>
            <button type="button" class="btn btn-primary" data-next>Next</button>
          </div>
        </div>

        <div class="multi-step">
          <h2>Step 3: Pricing</h2>
          <div class="form-grid two-col">
            <div class="form-group"><label for="price">Price</label><input id="price" name="price" class="form-control" type="number" /></div>
            <div class="form-group"><label for="period">Pricing period</label><select id="period" name="period" class="form-select"><option value="month">Per month</option><option value="week">Per week</option></select></div>
            <div class="form-group"><label for="deposit">Deposit</label><input id="deposit" name="deposit" class="form-control" type="number" /></div>
            <div class="form-group"><label for="fees">Additional fees</label><input id="fees" name="fees" class="form-control" type="number" /></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" data-prev>Previous</button>
            <button type="button" class="btn btn-primary" data-next>Next</button>
          </div>
        </div>

        <div class="multi-step">
          <h2>Step 4: Capacity</h2>
          <div class="form-grid two-col">
            <div class="form-group"><label for="capacity">Number of occupants</label><input id="capacity" name="capacity" class="form-control" type="number" /></div>
            <div class="form-group"><label for="rooms">Rooms</label><input id="rooms" name="rooms" class="form-control" type="number" /></div>
            <div class="form-group"><label for="beds">Beds</label><input id="beds" name="beds" class="form-control" type="number" /></div>
            <div class="form-group"><label for="furnished">Furnished</label><select id="furnished" name="furnished" class="form-select"><option value="yes">Yes</option><option value="no">No</option></select></div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" data-prev>Previous</button>
            <button type="button" class="btn btn-primary" data-next>Next</button>
          </div>
        </div>

        <div class="multi-step">
          <h2>Step 5: Amenities</h2>
          <div class="inline-checkboxes">
            <label class="checkbox-pill"><input type="checkbox" name="amenities" value="Wi-Fi" /> Wi-Fi</label>
            <label class="checkbox-pill"><input type="checkbox" name="amenities" value="Electricity" /> Electricity</label>
            <label class="checkbox-pill"><input type="checkbox" name="amenities" value="Water" /> Water</label>
            <label class="checkbox-pill"><input type="checkbox" name="amenities" value="Security" /> Security</label>
            <label class="checkbox-pill"><input type="checkbox" name="amenities" value="Parking" /> Parking</label>
            <label class="checkbox-pill"><input type="checkbox" name="amenities" value="Kitchen" /> Kitchen</label>
            <label class="checkbox-pill"><input type="checkbox" name="amenities" value="Laundry" /> Laundry</label>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" data-prev>Previous</button>
            <button type="button" class="btn btn-primary" data-next>Next</button>
          </div>
        </div>

        <div class="multi-step">
          <h2>Step 6: Review & submit</h2>
          <div id="review-output" class="review-block"></div>
          <div class="form-actions">
            <button type="button" class="btn btn-outline" data-prev>Previous</button>
            <button type="submit" class="btn btn-primary">Submit for verification</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../data/mock-data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
