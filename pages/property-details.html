<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Accommodation | Copartment</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body data-page="properties">
  <nav class="navbar">
    <div class="navbar-container">
      <a href="../index.html" class="navbar-logo">
        <span class="logo-icon">⌂</span>
        <span class="logo-text">Copartment</span>
      </a>
      <button class="navbar-toggle" aria-label="Toggle navigation"><span></span><span></span><span></span></button>
      <ul class="navbar-menu">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="properties.html" class="nav-link">Properties</a></li>
        <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="login.html" class="nav-link nav-link-secondary">Login</a></li>
        <li><a href="register.html" class="btn btn-primary nav-cta">Get Started</a></li>
      </ul>
    </div>
  </nav>

  <section class="page-hero">
    <div class="container">
      <div class="breadcrumbs">
        <a href="../index.html">Home</a> / <span>Accommodation</span>
      </div>
      <h1>Find your next place</h1>
    </div>
  </section>

  <main class="page-section">
    <div class="container">
      <div class="filter-toolbar">
        <div class="filter-group">
          <form id="property-filter-form" class="filter-group" style="align-items:flex-end;">
            <div class="search-group">
              <label for="location-filter">Location</label>
              <input id="location-filter" name="location" type="text" class="form-control" placeholder="City or area" />
            </div>
            <div class="search-group">
              <label for="type-filter">Type</label>
              <select id="type-filter" name="type" class="form-select">
                <option value="">Any type</option>
                <option value="Room">Room</option>
                <option value="Apartment">Apartment</option>
                <option value="Studio">Studio</option>
                <option value="Shared Apartment">Shared Apartment</option>
              </select>
            </div>
            <div class="search-group">
              <label for="max-price">Max price</label>
              <input id="max-price" name="maxPrice" type="number" class="form-control" placeholder="₦" />
            </div>
            <button type="submit" class="btn btn-primary">Apply filters</button>
          </form>
        </div>
        <div class="toolbar-toggle">
          <button type="button" class="toggle-button active" data-view="grid">Grid</button>
          <button type="button" class="toggle-button" data-view="list">List</button>
        </div>
      </div>

      <div class="page-grid">
        <aside class="sidebar">
          <div class="filter-panel">
            <div>
              <h3>Accommodation type</h3>
              <div class="inline-checkboxes">
                <label class="checkbox-pill"><input type="checkbox" /> Room</label>
                <label class="checkbox-pill"><input type="checkbox" /> Apartment</label>
                <label class="checkbox-pill"><input type="checkbox" /> Shared</label>
              </div>
            </div>

            <div>
              <h3>Price</h3>
              <input type="range" min="50000" max="800000" step="50000" value="400000" style="width:100%;" />
            </div>

            <div>
              <h3>Furnished</h3>
              <label class="checkbox-pill"><input type="checkbox" name="furnished" /> Furnished</label>
            </div>

            <div>
              <h3>Occupants</h3>
              <select class="form-select">
                <option>Any</option>
                <option>1</option>
                <option>2</option>
                <option>3+</option>
              </select>
            </div>
          </div>
        </aside>

        <section id="property-results" class="property-results"></section>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-grid">
        <div class="footer-column">
          <h4>Company</h4>
          <ul>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="faq.html">FAQs</a></li>
          </ul>
        </div>
        <div class="footer-column">
          <h4>Legal</h4>
          <ul>
            <li><a href="terms.html">Terms</a></li>
            <li><a href="privacy.html">Privacy</a></li>
            <li><a href="#">Safety</a></li>
          </ul>
        </div>
      </div>
    </div>
  </footer>

  <script src="../js/utils.js"></script>
  <script src="../data/mock-data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
