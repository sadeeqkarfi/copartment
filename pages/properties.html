<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Copartment</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="site-shell" data-page="register">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="navbar-logo" style="justify-content:center; margin-bottom: 18px;">
          <span class="logo-icon">⌂</span>
          <span class="logo-text">Copartment</span>
        </a>
        <h1>Create your account</h1>
        <p class="muted">Join as a guest or host.</p>
      </div>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" class="form-control" type="text" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input id="email" name="email" class="form-control" type="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone number</label>
          <input id="phone" name="phone" class="form-control" type="tel" placeholder="+2348000000000" required />
        </div>

        <div class="form-group">
          <label for="accountType">Account type</label>
          <select id="accountType" name="accountType" class="form-select" required>
            <option value="Guest">Guest</option>
            <option value="Host">Host</option>
          </select>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" class="form-control" type="password" placeholder="Create a password" required />
            <button class="password-toggle" type="button" aria-label="Toggle password visibility">Show</button>
          </div>
          <div class="strength-bar"><span id="password-strength"></span></div>
        </div>

        <label style="display:flex; align-items:flex-start; gap:8px;">
          <input type="checkbox" required />
          <span>I agree to the terms and privacy policy.</span>
        </label>

        <button type="submit" class="btn btn-primary btn-lg">Create account</button>
        <p class="center muted">Already have an account? <a href="login.html" class="form-link">Login</a></p>
      </form>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../data/mock-data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
