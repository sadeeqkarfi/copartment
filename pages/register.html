<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Copartment</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/responsive.css" />
</head>
<body class="site-shell" data-page="login">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="navbar-logo" style="justify-content:center; margin-bottom: 18px;">
          <span class="logo-icon">⌂</span>
          <span class="logo-text">Copartment</span>
        </a>
        <h1>Welcome back</h1>
        <p class="muted">Log in to continue your accommodation journey.</p>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email or phone</label>
          <input id="email" name="email" class="form-control" type="text" placeholder="your@email.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" name="password" class="form-control" type="password" placeholder="Enter your password" required />
            <button class="password-toggle" type="button" aria-label="Toggle password visibility">Show</button>
          </div>
        </div>

        <div class="inline-actions" style="justify-content: space-between; align-items:center;">
          <label style="display:flex; align-items:center; gap:8px;"><input type="checkbox" /> Remember me</label>
          <a href="#" class="form-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg">Login</button>
        <p class="center muted">Don’t have an account? <a href="register.html" class="form-link">Create one</a></p>
      </form>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script src="../data/mock-data.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
